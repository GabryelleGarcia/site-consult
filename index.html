  <script src="/_sdk/b3bf9e8ac58e6ad6.data_sdk.js" integrity="sha512-otc1u9NYq9Ms5Jt//7vmhrrqR5CLPr8Jdgs6741gqniClfLMcfmC+jK/cKuQdhLv6G0esJ/FzaMS9tv0T/vj/Q=="></script>
  <script>
        lucide.createIcons();

        const form = document.getElementById('quote-form');
        const submitBtn = form.querySelector('[type="submit"]');
        const successMsg = document.getElementById('success-msg');
        const errorMsg = document.getElementById('error-msg');

        (async () => {
            await window.dataSdk.init({ onDataChanged() {} });
        })();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.6';
            successMsg.classList.add('hidden');
            errorMsg.classList.add('hidden');

            const result = await window.dataSdk.create({
                name: document.getElementById('fname').value,
                email: document.getElementById('femail').value,
                phone: document.getElementById('fphone').value,
                insurance_type: document.getElementById('ftype').value,
                message: document.getElementById('fmsg').value,
                submitted_at: new Date().toISOString()
            });

            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';

            if (result.isOk) {
                successMsg.classList.remove('hidden');
                form.reset();
            } else {
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
